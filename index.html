<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Girder Gorilla • Retro Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090e;color:#eee;font:14px monospace;display:flex;justify-content:center;min-height:100dvh}main{width:min(100%,560px);padding:8px 10px 12px}header{display:flex;align-items:center;justify-content:space-between;height:42px}h1{font-size:19px;letter-spacing:2px;color:#ff657b;margin:0}button,select{font:inherit;color:#eee;background:#191b2a;border:1px solid #454a69;border-radius:6px;padding:9px;cursor:pointer}button:active{background:#54516d}canvas{width:100%;max-height:72dvh;aspect-ratio:480/580;display:block;object-fit:contain;background:#000;image-rendering:pixelated;border:2px solid #404054;box-shadow:0 0 35px #ed34601c;touch-action:none}nav{display:flex;gap:6px;margin:8px 0}nav button{flex:1}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.controls button{height:53px;font-size:23px;touch-action:none;user-select:none;-webkit-user-select:none}.controls button:last-child{font-size:15px;color:#ffd865;border-color:#947436}p{font-size:11px;line-height:1.6;margin:8px 0;color:#acaec1}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{min-height:20px;color:#ffd865;font-size:12px}a{color:#addaff} @media(min-height:900px){canvas{max-height:76dvh}}
</style><main><header><h1>GIRDER GORILLA</h1><button id="sound">SOUND OFF</button></header><canvas id="screen" width="480" height="580" aria-label="Retro climbing arcade game"></canvas><nav><button id="start">START GAME</button><button id="pause">PAUSE</button><button id="full">FULLSCREEN</button></nav><div class="controls"><button data-k="ArrowLeft" aria-label="Left">◀</button><button data-k="ArrowUp" aria-label="Climb up">▲</button><button data-k="ArrowDown" aria-label="Climb down">▼</button><button data-k="ArrowRight" aria-label="Right">▶</button><button data-k="Space">JUMP</button></div><div class="row"><p>Arrows / WASD move & climb · Space jumps · P pauses<br>Reach the beacon. Jump barrels. Grab a hammer.</p><select id="difficulty" aria-label="Difficulty"><option value="0.78">RELAXED</option><option value="1" selected>ARCADE</option><option value="1.22">HARD</option></select></div><div class="status" id="status">Five floors. One rescue. Keep climbing.</div><p>Original pixel-art tribute to early climbing arcade games. Works offline; no downloads or accounts needed.</p></main><script>
'use strict';
const canvas=document.getElementById('screen'),g=canvas.getContext('2d');g.imageSmoothingEnabled=false;const el=id=>document.getElementById(id),keys={};let mode='title',score=0,best=0,lives=3,stage=1,time=90,clock=0,spawn=0,barrels=[],sparks=[],pops=[],player,hammer=null,inv=0,rescue=0,sound=false,audio=null,last=0,acc=0,diff=1,removed=new Set();
try{best=+localStorage.getItem('girder-gorilla-best')||0}catch(e){}
const floors=[{y:526,s:-.055},{y:434,s:.055},{y:342,s:-.055},{y:250,s:.055},{y:158,s:-.035}];let ladders=[];
function fy(i,x){return floors[i].y+floors[i].s*(x-240)}
function tone(f,d=.08,type='square',vol=.035){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(vol,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function status(s){el('status').textContent=s}
function setup(){ladders=[];for(let i=0;i<4;i++){let xs=stage%3===2?[95,245,395]:[i%2?95:385,240];xs.forEach((x,j)=>ladders.push({x,i,broken:j===1&&stage%3===1}))}player={x:42,y:fy(0,42),floor:0,vy:0,air:false,climb:null,face:1,walk:0,hammer:0};barrels=[];sparks=[];pops=[];removed=new Set();hammer={x:stage%2?140:340,floor:1};time=Math.max(60,100-stage*3);clock=0;spawn=1.4;inv=1.5;rescue=0}
function start(){diff=+el('difficulty').value;score=0;lives=3;stage=1;setup();mode='play';el('start').textContent='RESTART';el('pause').textContent='PAUSE';status('Reach the flashing beacon on the top floor.');tone(440,.15)}
function points(n,x,y){score+=n;pops.push({x,y,t:1,text:'+'+n});if(score>best){best=score;try{localStorage.setItem('girder-gorilla-best',best)}catch(e){}}}
function hurt(){if(inv>0||mode!=='play')return;lives--;tone(90,.35,'sawtooth');if(!lives){mode='over';status('Game over. Start again to beat your best.')}else{let oldTime=time;setup();time=oldTime;inv=2;status('Stay sharp — '+lives+' lives left.')}}
function jump(){if(mode==='title'||mode==='over'){start();return}if(mode!=='play'||player.air||player.climb)return;player.air=true;player.vy=-235;tone(620,.09)}
function update(dt){if(mode==='win'){rescue-=dt;if(rescue<=0){stage++;setup();mode='play';status(stage%3===0?'Rivet round: collect eight bolts, then reach the beacon.':'Stage '+stage+' — watch for ladder drops.')}return}if(mode!=='play')return;clock+=dt;time-=dt;inv=Math.max(0,inv-dt);if(time<=0){hurt();time=80;return}player.hammer=Math.max(0,player.hammer-dt);player.walk+=dt*((keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown)?12:0);let axis=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),vert=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
if(player.climb){let l=player.climb;player.x=l.x;player.y+=vert*80*dt;let top=fy(l.i+1,l.x),bottom=fy(l.i,l.x);if(player.y<=top){player.y=top;player.floor=l.i+1;player.climb=null}if(player.y>=bottom){player.y=bottom;player.floor=l.i;player.climb=null}}
else{player.x=Math.max(28,Math.min(452,player.x+axis*104*dt));if(axis)player.face=axis;if(!player.air&&vert){let l=ladders.find(l=>!l.broken&&Math.abs(player.x-l.x)<13&&(vert<0?l.i===player.floor:l.i+1===player.floor));if(l){player.climb=l;player.x=l.x;player.y+=vert*3}}if(player.air){player.vy+=620*dt;player.y+=player.vy*dt;let ground=fy(player.floor,player.x);if(player.y>=ground&&player.vy>0){player.y=ground;player.vy=0;player.air=false}}else if(!player.climb)player.y=fy(player.floor,player.x)}
if(hammer&&player.floor===hammer.floor&&Math.abs(player.x-hammer.x)<18&&!player.air){player.hammer=8;hammer=null;points(300,player.x,player.y-35);status('HAMMER! Smash barrels for eight seconds.');tone(220,.25)}
spawn-=dt;if(spawn<=0){let speed=(58+Math.min(stage,12)*4)*diff;barrels.push({x:100,y:fy(4,100)-10,floor:4,dir:1,speed,fall:false,vy:0,rot:0,passed:false,blue:Math.random()<.16});spawn=Math.max(1.15,3-stage*.13)/diff;tone(130,.035)}
for(let b of barrels){b.rot+=b.dir*dt*7;if(b.fall){b.vy+=440*dt;b.y+=b.vy*dt;if(b.y>=fy(b.floor,b.x)-10){b.fall=false;b.y=fy(b.floor,b.x)-10;b.dir=b.floor%2?-1:1;b.passed=false}}else{b.x+=b.dir*b.speed*dt;b.y=fy(b.floor,b.x)-10;let drop=ladders.find(l=>l.i+1===b.floor&&Math.abs(b.x-l.x)<3&&!l.broken);if(drop&&Math.random()<dt*(b.blue?35:5)){b.floor--;b.fall=true;b.vy=30;b.x=drop.x}else if(b.x>449||b.x<31){if(b.floor>0){b.x=Math.max(31,Math.min(449,b.x));b.floor--;b.fall=true;b.vy=0}else b.dead=true}}
let dx=Math.abs(b.x-player.x),dy=Math.abs(b.y-(player.y-13));if(dx<25&&dy<32&&player.hammer>0){b.dead=true;points(500,b.x,b.y);tone(145,.09,'triangle')}else if(dx<17&&dy<19)hurt();if(!b.passed&&player.air&&b.floor===player.floor&&dx<20&&player.y<b.y-15){b.passed=true;points(100,b.x,b.y-25);tone(880,.08)}}barrels=barrels.filter(b=>!b.dead);
if(stage>=2&&sparks.length===0)sparks.push({x:330,floor:Math.min(3,1+(stage%3)),dir:-1});for(let s of sparks){s.x+=s.dir*(29+stage*2)*dt;if(s.x<60||s.x>420)s.dir*=-1;if(player.floor===s.floor&&Math.abs(s.x-player.x)<18&&Math.abs(player.y-fy(s.floor,s.x))<22){if(player.hammer){points(400,s.x,player.y);s.x=440;s.floor=(s.floor+1)%4}else hurt()}}
if(stage%3===0&&!player.air&&!player.climb){for(let i=0;i<4;i++)for(let x of [65,415]){let id=i+':'+x;if(!removed.has(id)&&player.floor===i&&Math.abs(player.x-x)<13){removed.add(id);points(200,x,fy(i,x)-25);tone(760,.1)}}}
if(player.floor===4&&player.x>391&&!player.air&&(stage%3!==0||removed.size===8)){points(Math.floor(time)*10,player.x,player.y-35);mode='win';rescue=2.8;tone(523,.2);setTimeout(()=>tone(784,.3),180);status('RESCUED! Bonus awarded. Next stage incoming…')}
pops.forEach(p=>{p.t-=dt;p.y-=20*dt});pops=pops.filter(p=>p.t>0)}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(t,x,y,c='#fff',size=14,align='left'){g.font='bold '+size+'px monospace';g.textAlign=align;g.fillStyle=c;g.fillText(t,x,y)}
function sprite(rows,x,y,size,palette,flip=false){rows.forEach((r,yy)=>[...r].forEach((c,xx)=>{if(palette[c])rect(x+(flip?r.length-1-xx:xx)*size,y+yy*size,size,size,palette[c])}))}
const worker=['...RRRR...','..RRRRRR..','...SSS....','..SKSSK...','...SSSS...','..BBBBB...','.SBBYBBS..','.SBBBBBS..','..BBBBB...','..BB.BB...','..BB.BB...','.KK...KK..'];const ape=['..AAAAAA....AAAAAA..','.AAAAAAAAAAAAAAAAAA.','AAAATTTAAAAATTTAAAAA','AAATWKTAAAAATKWTAAAA','AAAATTTAAAAATTTAAAAA','AAAAAAAAAAAAAAAAAAAA','AAAAAATTTTTTTTAAAAAA','.AAAATTTKKKKTTTAAAA.','..AAATTTTTTTTTTAAA..','.AAAAAAAAAAAAAAAAAA.','AAAAAA.AAAAAA.AAAAAA','AAAAA..AAAAAA..AAAAA','TTT....AAAAAA....TTT','TTT....AA..AA....TTT','......AAA..AAA......','.....TTTT..TTTT.....'];
function draw(){g.fillStyle='#020207';g.fillRect(0,0,480,580);txt('1UP',24,23,'#ff677c',12);txt(String(score).padStart(6,'0'),24,42);txt('HIGH SCORE',240,23,'#ff677c',12,'center');txt(String(best).padStart(6,'0'),240,42,'#fff',14,'center');txt('L'+String(stage).padStart(2,'0'),450,23,'#6ac9ff',12,'right');txt('♥'.repeat(Math.max(0,lives)),450,42,'#ff677c',15,'right');txt('BONUS '+Math.max(0,Math.ceil(time)*10),450,67,'#ffe166',12,'right');
for(let i=0;i<5;i++){let f=floors[i];g.strokeStyle='#f54973';g.lineWidth=4;g.beginPath();g.moveTo(22,fy(i,22));g.lineTo(458,fy(i,458));g.moveTo(22,fy(i,22)+9);g.lineTo(458,fy(i,458)+9);g.stroke();g.lineWidth=1;for(let x=25;x<451;x+=20){g.beginPath();g.moveTo(x,fy(i,x));g.lineTo(x+18,fy(i,x+18)+9);g.moveTo(x,fy(i,x)+9);g.lineTo(x+18,fy(i,x+18));g.stroke()}if(stage%3===0&&i<4)for(let x of [65,415])if(!removed.has(i+':'+x))rect(x-4,fy(i,x)-7,8,8,'#ffe166')}
for(let l of ladders){let a=fy(l.i+1,l.x)+10,b=fy(l.i,l.x);for(let y=a;y<b;y+=8){if(l.broken&&y>a+25&&y<b-25)continue;rect(l.x-7,y,2,8,'#65c9e6');rect(l.x+6,y,2,8,'#65c9e6');rect(l.x-6,y+3,12,2,'#65c9e6')}}
sprite(ape,38,fy(4,60)-66+(Math.sin(clock*3)>0?0:-2),3,{A:'#994e31',T:'#e0a168',W:'#fff5db',K:'#21171a'});for(let j=0;j<3;j++){rect(25+j*15,122,12,18,'#b96a3d');rect(27+j*15,124,8,2,'#ffe09c');rect(27+j*15,134,8,2,'#ffe09c')}
let beacon=fy(4,420);rect(405,beacon-40,28,4,'#84f4dc');rect(405,beacon-40,3,40,'#84f4dc');rect(430,beacon-40,3,40,'#84f4dc');sprite(['..PPPP..','...SS...','...SS...','..CCCC..','.CCCCCC.','CCCCCCCC','...SS...','..S..S..'],410,beacon-33,3,{P:'#ffd94c',S:'#ffc3a2',C:'#ae91ff'});if(Math.floor(clock*3)%2===0)txt('HELP!',418,beacon-49,'#fff',12,'center');
if(hammer){let y=fy(hammer.floor,hammer.x)-22;rect(hammer.x-2,y,4,19,'#fff2b5');rect(hammer.x-10,y-4,20,9,'#71c7f4')}
for(let b of barrels){g.save();g.translate(Math.round(b.x),Math.round(b.y));g.rotate(b.rot);g.strokeStyle=b.blue?'#72d7ff':'#e0a15b';g.lineWidth=3;g.beginPath();g.arc(0,0,9,0,Math.PI*2);g.stroke();g.lineWidth=2;g.strokeRect(-5,-6,10,12);g.beginPath();g.moveTo(-8,0);g.lineTo(8,0);g.stroke();g.restore()}
for(let s of sparks){let y=fy(s.floor,s.x)-20;sprite(['..F.F...','.FFFFF..','FFFFYFF.','.FYYFF..','..YY....','..WW....'],s.x-10,y,3,{F:Math.sin(clock*15)>0?'#ff7941':'#ffcc42',Y:'#fff19e',W:'#fff'})}
if(player&&(inv<=0||Math.floor(clock*12)%2===0)){let y=player.y-25;g.save();if(player.walk%2>1&&!player.air&&!player.climb)y-=1;sprite(worker,player.x-10,y,2,{R:'#ff6950',S:'#ffd6a0',K:'#413d71',B:'#63a6ff',Y:'#ffdd61'},player.face<0);if(player.hammer){let swing=Math.floor(clock*6)%2;rect(player.x+player.face*13,player.y-(swing?35:20),4,16,'#ffe5a0');rect(player.x+player.face*13-6,player.y-(swing?38:24),16,8,'#73cbfa');txt('HAMMER '+Math.ceil(player.hammer),240,565,'#ffe166',12,'center')}g.restore()}
for(let p of pops)txt(p.text,p.x,p.y,'#fff3a7',12,'center');if(stage%3===0)txt('BOLTS '+removed.size+'/8',24,565,'#ffe166',12);else txt('CLIMB • JUMP • RESCUE',240,565,'#8498bf',11,'center');
if(mode!=='play'){g.fillStyle='#020207dc';g.fillRect(35,200,410,192);let title=mode==='title'?'GIRDER GORILLA':mode==='over'?'GAME OVER':mode==='pause'?'PAUSED':'RESCUED!';txt(title,240,244,'#ff657b',27,'center');txt(mode==='title'?'1980s CLIMBING ARCADE':mode==='win'?'NEXT STAGE '+(stage+1):'SCORE '+score,240,278,'#ffe166',14,'center');txt(mode==='title'?'DODGE BARRELS. REACH THE BEACON.':mode==='over'?'THREE LIVES. ANOTHER CHANCE.':mode==='pause'?'PRESS P OR PAUSE TO RESUME':'BONUS ADDED TO YOUR SCORE',240,313,'#d3e5ff',12,'center');txt(mode==='win'?'GET READY…':mode==='pause'?'TAKE A BREATH.':'PRESS START / SPACE',240,353,'#fff',15,'center')}
// Subtle fixed scanlines, without expensive screen filters.
g.fillStyle='#00000024';for(let y=0;y<580;y+=4)g.fillRect(0,y,480,1)}
function frame(t){let dt=Math.min(.1,(t-last)/1000||0);last=t;acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60}draw();requestAnimationFrame(frame)}
function togglePause(){if(mode==='play'){mode='pause';el('pause').textContent='RESUME'}else if(mode==='pause'){mode='play';el('pause').textContent='PAUSE'}}
const aliases={a:'ArrowLeft',d:'ArrowRight',w:'ArrowUp',s:'ArrowDown',' ':'Space'};
window.addEventListener('keydown',e=>{let k=aliases[e.key.toLowerCase()]||e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(k)){e.preventDefault();if(k==='Space'&&!keys[k]&&!e.repeat)jump();keys[k]=true}if(e.key.toLowerCase()==='p'&&!e.repeat)togglePause()});window.addEventListener('keyup',e=>{keys[aliases[e.key.toLowerCase()]||e.code]=false});function clear(){Object.keys(keys).forEach(k=>keys[k]=false)}window.addEventListener('blur',()=>{clear();if(mode==='play')togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clear();if(mode==='play')togglePause()}});
document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);let k=b.dataset.k;keys[k]=true;if(k==='Space')jump()});['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>{keys[b.dataset.k]=false}))});el('start').onclick=start;el('pause').onclick=togglePause;el('sound').onclick=()=>{sound=!sound;el('sound').textContent=sound?'SOUND ON':'SOUND OFF';tone(440)};el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.querySelector('main').requestFullscreen)await document.querySelector('main').requestFullscreen();else status('Fullscreen is unavailable here; rotate your phone for a larger view.')}catch(e){status('Fullscreen unavailable in this browser.')}};setup();requestAnimationFrame(frame);
</script></html>
